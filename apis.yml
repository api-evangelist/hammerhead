name: Hammerhead
description: >-
  Hammerhead is a cycling technology company (now part of SRAM) best known for
  the Karoo GPS cycling computer, a premium Android-based device for recording
  and displaying ride data, routes, structured workouts, and Flight Attendant
  performance. Its ecosystem includes the web Dashboard (dashboard.hammerhead.io)
  and a Companion mobile app that bridge ride data between rider, device, and
  third parties. Hammerhead runs one of the more open developer platforms in the
  category: a public API that lets connected third parties sync routes and
  workouts, and the karoo-ext Android/Kotlin Extensions SDK (io.hammerhead:karoo-ext,
  Apache-2.0) that lets developers build on-device extensions for Karoo and Karoo 2.
